name: DevFlows cross-repo E2E (docs-build)

on:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * 1" # weekly, Monday 06:37 UTC

permissions:
  contents: read
  actions: read

jobs:
  docs:
    # Pinned to main during DevFlows' 0.x phase; switch to an exact release tag once tags exist.
    uses: QuanTizEd8/DevFlows/.github/workflows/docs-build.yaml@main
    with:
      docs-tool: sphinx
      docs-environment: pip
      pip-install-targets: |
        sphinx==8.1.3
      sphinx-source-directory: docs-src
      docs-output-directory: _site
      docs-warnings-as-errors: true
      artifact-upload-enabled: true
      artifact-upload-name: e2e-docs-site
      artifact-upload-path: _site
      artifact-upload-if-no-files-found: error

  assert:
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-docs-site
          path: site
      - name: Assert site content
        run: |
          test -f site/index.html
          grep -q "DevFlows cross-repo docs e2e" site/index.html
          echo "Cross-repo docs-build verified."
