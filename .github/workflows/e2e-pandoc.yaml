name: DevFlows cross-repo E2E (pandoc)

# This repository is a real external consumer of the DevFlows reusable
# workflows. It exists to catch cross-repo failures that DevFlows' own
# same-repo scenario suite structurally cannot see (runtime script
# resolution, permission validation, token scoping from a caller's
# perspective).

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC

# Pandoc's published form embeds a writeback commit job; GitHub validates the
# nested permissions before the run starts, so callers grant the union even
# for read-only conversions.
permissions:
  contents: write
  actions: read

jobs:
  convert:
    # Pinned to main during DevFlows' 0.x phase; switch to an exact release
    # tag (e.g. pandoc/v0.x.y) once tags exist.
    uses: QuanTizEd8/DevFlows/.github/workflows/pandoc.yaml@main
    with:
      pandoc-image: pandoc/core:3.8
      pandoc-arguments: >-
        --standalone --output=output/example.html input/example.md
      artifact-upload-enabled: true
      artifact-upload-name: e2e-pandoc-html
      artifact-upload-path: output/example.html

  assert:
    needs: convert
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download converted output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-pandoc-html
          path: result
      - name: Assert HTML content
        run: |
          test -f result/example.html
          grep -q "DevFlows cross-repo e2e heading" result/example.html
          grep -qi "<html" result/example.html
          echo "Cross-repo pandoc conversion verified."
